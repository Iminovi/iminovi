<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Video Streaming</title>
  <link rel="stylesheet" href="style.css">
  <meta name="monetag" content="7ef44d266fff2a2a4d273dfcffd95e36">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding-bottom: 40px; }
    
    header {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
      padding: 30px 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 2rem; margin-bottom: 5px; }
    header p { opacity: 0.9; font-size: 0.95rem; }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 15px; }

    /* Bar Pencarian & Kategori */
    .filter-section {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .search-input {
      flex: 1 1 250px;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      font-size: 0.95rem;
    }
    .search-input:focus { border-color: #2a5298; }
    .category-select {
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      outline: none;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* Grid Video */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .video-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    }
    .video-info { padding: 15px; }
    .category-badge {
      display: inline-block;
      background: #e1f0ff;
      color: #0066cc;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .video-title { font-size: 1.05rem; font-weight: 600; color: #222; margin-bottom: 10px; line-height: 1.4; }
    
    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
    }
    .player-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }
    .no-data {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: #777;
    }
  </style>
  <meta name="monetag" content="7ef44d266fff2a2a4d273dfcffd95e36">
</head>
<body>

  <header>
    <h1>Koleksi Video Streaming</h1>
    <p>Streaming cepat, lengkap, dan diperbarui otomatis</p>
  </header>

  <main class="container">
    <!-- Filter Section -->
    <div class="filter-section">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari judul video...">
      <select id="categorySelect" class="category-select">
        <option value="ALL">Semua Kategori</option>
      </select>
    </div>

    <!-- Video Grid -->
    <div id="videoList" class="video-grid">
      <div class="no-data"><p>Memuat koleksi video...</p></div>
    </div>
  </main>

  <script>
    let allVideos = [];

    // Ambil data dari videos.json
    fetch('videos.json')
      .then(response => response.json())
      .then(data => {
        allVideos = data;
        populateCategories(data);
        renderVideos(data);
      })
      .catch(error => {
        console.error('Gagal memuat video:', error);
        document.getElementById('videoList').innerHTML = '<div class="no-data"><p>Gagal memuat data video.</p></div>';
      });

    // Isi daftar dropdown kategori secara otomatis dari data JSON
    function populateCategories(videos) {
      const categorySelect = document.getElementById('categorySelect');
      const categories = new Set();

      videos.forEach(v => {
        if (v.category) categories.add(v.category.trim());
      });

      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    // Tampilkan daftar video sesuai filter
    function renderVideos(videos) {
      const container = document.getElementById('videoList');
      container.innerHTML = '';

      if (videos.length === 0) {
        container.innerHTML = '<div class="no-data"><p>Tidak ada video yang ditemukan.</p></div>';
        return;
      }

      videos.forEach(item => {
        const categoryName = item.category || 'Umum';
        const card = document.createElement('div');
        card.className = 'video-card';
        
        card.innerHTML = `
          <div class="player-wrapper">
            <iframe src="${item.videoUrl}" scrolling="no" allowfullscreen="true"></iframe>
          </div>
          <div class="video-info">
            <span class="category-badge">${categoryName}</span>
            <h3 class="video-title">${item.title}</h3>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Fungsi Filter berdasarkan kata kunci & kategori
    function filterVideos() {
      const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      const selectedCategory = document.getElementById('categorySelect').value;

      const filtered = allVideos.filter(video => {
        const matchesSearch = video.title.toLowerCase().includes(searchKeyword);
        const matchesCategory = (selectedCategory === 'ALL') || (video.category && video.category.trim() === selectedCategory);
        return matchesSearch && matchesCategory;
      });

      renderVideos(filtered);
    }

    // Event Listener untuk input & dropdown
    document.getElementById('searchInput').addEventListener('input', filterVideos);
    document.getElementById('categorySelect').addEventListener('change', filterVideos);
  </script>

</body>
</html>
