<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Streaming Sederhana</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .video-card {
      background: #fff;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* Rasio aspek 16:9 */
      height: 0;
      overflow: hidden;
      margin-top: 10px;
    }
    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .affiliate-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #ee4d2d;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Koleksi Video Terbaru</h1>
    <p>Streaming langsung dari galeri otomatis</p>
  </header>

  <main class="container">
    <div id="videoList" class="video-grid">
      <!-- Daftar video akan dimuat otomatis lewat JavaScript -->
      <p>Memuat video...</p>
    </div>
  </main>

  <script>
    // Ambil data dari file videos.json
    fetch('videos.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('videoList');
        container.innerHTML = ''; // Kosongkan teks loading

        if (data.length === 0) {
          container.innerHTML = '<p>Belum ada video.</p>';
          return;
        }

        // Loop setiap video di database
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'video-card';
          
          card.innerHTML = `
            <h3>${item.title}</h3>
            <div class="player-wrapper">
              <iframe src="${item.videoUrl}" scrolling="no" allowfullscreen="true"></iframe>
            </div>
            <!-- Tombol Link Affiliate Shopee (Opsional) -->
            ${item.affiliateUrl ? `<a href="${item.affiliateUrl}" target="_blank" class="affiliate-btn">🛍️ Cek Produk Terkait di Shopee</a>` : ''}
          `;
          container.appendChild(card);
        });
      })
      .catch(error => {
        console.error('Gagal memuat video:', error);
        document.getElementById('videoList').innerHTML = '<p>Gagal memuat data video.</p>';
      });
  </script>

</body>
</html>
