# fly.toml app configuration file generated for streaming-sederhana on 2026-10-22T01:40:01Z
#
# vSee https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'streaming-sederhana'
primary_region = 'sin'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
